name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Submit sitemap to IndexNow
        if: success()
        run: |
          KEY="69fccaa852c5480ea81d39b6f4c8cb68q"
          HOST="gamesforwatch.com"
          KEY_LOCATION="https://${HOST}/${KEY}.txt"
          SITEMAP_URL="https://${HOST}/sitemap.xml"

          PAYLOAD=$(cat <<EOF
          {
            "host": "${HOST}",
            "key": "${KEY}",
            "keyLocation": "${KEY_LOCATION}",
            "urlList": ["${SITEMAP_URL}"]
          }
          EOF
          )

          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "${PAYLOAD}"
          echo
